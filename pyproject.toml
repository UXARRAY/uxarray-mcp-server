[project]
name = "uxarray-mcp"
version = "2026.10.1"
description = "MCP server for analyzing unstructured meshes with UXarray"
readme = "README.md"
keywords = ["uxarray", "mcp", "unstructured grids", "scientific computing", "globus compute"]
classifiers = [
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
]
authors = [
    { name = "Rajeev Jain", email = "rajeeja@gmail.com" },
    { name = "Dayan Abdulla", email = "dayanabdulla000@gmail.com" },
]
license = { file = "LICENSE" }
# The floor is 3.12; there is deliberately no upper bound.
#
# This used to read ">=3.12,<3.13" because of globus/globus-compute#2139: a
# 3.13 submitter against a 3.12 worker raises WorkerLost on non-trivial
# payloads. That is a real constraint, but it belongs to the *HPC* path only,
# and pinning the whole package for it made every local-only user -- the large
# majority -- pay for a feature they never enable. It also blocked the conda
# recipe and any container base that is not exactly 3.12.
#
# The constraint is now enforced where it actually applies: `uxarray_mcp.remote`
# checks the submitter's Python at import time and refuses to configure an
# endpoint from an unsupported interpreter, and `remote.health` already warns on
# submitter/worker minor-version skew at probe time. A local install on 3.12 or
# 3.13 works and never touches that code.
#
# The 3.12 floor is also imposed by uxarray[geo,viz]>=2026.10.1, which itself
# requires Python >=3.12. All other runtime dependencies (mcp,
# toolregistry-server, holoviews) declare >=3.10.
requires-python = ">=3.12"
dependencies = [
    # 0.7.0 is the floor: it pairs with toolregistry 0.19 below, whose
    # schema change alters what every served tool advertises.
    "toolregistry-server[mcp]>=0.7.0",
    # Imported directly (ToolRegistry, ToolTag), so it is declared directly
    # rather than leaned on transitively. 0.16.0 taught is_content_block_list
    # about audio/resource_link/resource; 0.17 froze ToolMetadata, so the
    # policy-tag merge has to mutate the tag sets in place rather than
    # rebind them, and 0.18 registers call_deferred beside discover_tools.
    # 0.19 is the floor because it emits `anyOf` for a heterogeneous union
    # instead of dropping branches (Oaklight/ToolRegistry#269). Below it,
    # `lat_spec` reached clients as an untyped blob and we repaired the
    # schema on the way out; that repair is gone, so an older registry
    # would silently under-advertise the parameter. See #165.
    "toolregistry>=0.19.0",
    # Both SDK generations are in range and register handlers differently:
    # 1.27.2 has the per-method decorators and no `add_request_handler`, 2.1.1
    # has `add_request_handler` and no decorators. `resources.py` registers
    # through whichever is present, and `tests/test_artifact_resources.py`
    # passes on both.
    "mcp>=1.27,<3",
    "holoviews>=1.19.0",
    "matplotlib>=3.9.0",
    # 6.0.1, not 6.0: PyYAML 6.0 ships no wheel for CPython 3.12 and its sdist
    # cannot build against a modern Cython, failing with `'build_ext' object has
    # no attribute 'cython_sources'`. Nothing hit it in normal CI because that
    # resolves to the newest PyYAML; the weekly `lowest-direct` job installs the
    # floor we actually declare, and had failed on it every run since
    # 2026-08-10.
    "pyyaml>=6.0.1",
    # `[geo,viz]`, not a bare `uxarray`. 2026.9.1 moved cartopy, healpix,
    # hvplot, geopandas and the rest out of uxarray's required set and into
    # extras (UXARRAY/uxarray#1548). This server imports cartopy directly in
    # four modules, opens `healpix:<zoom>` grids in most tools, and renders
    # through hvplot, so it needs both groups; they arrived transitively
    # before and would have gone missing silently on the next resolve.
    # Installing 2026.9.1 without them fails 95 tests with
    # OptionalDependencyNotFoundError.
    "uxarray[geo,viz]>=2026.10.1,<2026.11",
]

[project.optional-dependencies]
hpc = [
    "globus-compute-sdk>=4.5.0",
]

[project.scripts]
uxarray-mcp = "uxarray_mcp.cli:main"

[project.urls]
Source = "https://github.com/UXARRAY/uxarray-mcp-server"
Tracker = "https://github.com/UXARRAY/uxarray-mcp-server/issues"

[dependency-groups]
dev = [
    # Declared so the outputSchema conformance tests cannot silently skip.
    # jsonschema arrives transitively today, which means a resolver change
    # would turn the checks that hold every result to its published envelope
    # into a green no-op.
    "jsonschema>=4.20.0",
    "mypy>=1.10.0",
    # Same reason as jsonschema: the suite-integrity check reads the declared
    # uxarray floor out of the packaging metadata so it cannot drift from this
    # file, and it needs a specifier parser to do that.
    "packaging>=23.0",
    "pre-commit>=4.3.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.15.2",
]

[tool.mypy]
# Type-check against the floor, not the container's interpreter: 3.11 is the
# lowest version we claim to support, so that is where checking has to happen.
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
# Exclude test files and generated docs
exclude = ["tests/", "docs/"]

[[tool.mypy.overrides]]
# yaml stubs are installed in pre-commit env via types-PyYAML;
# suppress the missing-stubs warning in local runs without them.
module = "yaml"
ignore_missing_imports = true


[[tool.mypy.overrides]]
# academy fallback stubs; removed with remote/agent.py in v2.
module = "uxarray_mcp.remote.agent"
warn_unused_ignores = false

[build-system]
requires = ["uv_build>=0.9.26,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["uxarray_mcp"]

[tool.ruff.format]
docstring-code-format = true
