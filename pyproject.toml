[project]
name = "uxarray-mcp"
version = "2026.10.1"
description = "MCP server for analyzing unstructured meshes with UXarray"
readme = "README.md"
keywords = ["uxarray", "mcp", "unstructured grids", "scientific computing", "globus compute"]
classifiers = [
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
authors = [
    { name = "Rajeev Jain", email = "rajeeja@gmail.com" },
    { name = "Dayan Abdulla", email = "dayanabdulla000@gmail.com" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
# uxarray[geo,viz]>=2026.10.1 needs 3.12; no upper bound.
requires-python = ">=3.12"
dependencies = [
    # 0.9.0 requires toolregistry>=0.20.1; both move together.
    "toolregistry-server[mcp]>=0.9.0",
    "toolregistry>=0.21.0",
    "mcp>=1.27,<3",
    "holoviews>=1.19.0",
    "matplotlib>=3.9.0",
    "netcdf4>=1.6",
    "pyyaml>=6.0.1",
    # [geo,viz]: cartopy, healpix, hvplot, geopandas are extras upstream and
    # this server imports them directly.
    "uxarray[geo,viz]>=2026.10.1,<2026.11",
]

[project.optional-dependencies]
hpc = [
    "globus-compute-sdk>=4.5.0",
]

[project.scripts]
uxarray-mcp = "uxarray_mcp.cli:main"

[project.urls]
Source = "https://github.com/UXARRAY/uxarray-mcp-server"
Tracker = "https://github.com/UXARRAY/uxarray-mcp-server/issues"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pre-commit>=4.3.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.15.2",
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
# Exclude test files and generated docs
exclude = ["tests/", "docs/"]

[[tool.mypy.overrides]]
# yaml stubs are installed in pre-commit env via types-PyYAML;
# suppress the missing-stubs warning in local runs without them.
module = "yaml"
ignore_missing_imports = true


[build-system]
requires = ["uv_build>=0.9.26,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["uxarray_mcp"]

[tool.ruff.format]
docstring-code-format = true
