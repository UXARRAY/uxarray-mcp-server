name: Dependency audit

# Thirteen known-vulnerable packages sat in uv.lock -- cryptography with a
# Bleichenbacher oracle, starlette with request-authority poisoning, urllib3
# ignoring HTTPS proxy TLS config, and ten more -- because no job ever read an
# advisory database. zizmor audits the workflow files and upstream-compat
# probes our four direct upstreams; neither of those is a CVE scan.
#
# Runs on a schedule as well as on lockfile changes: an advisory can be
# published for a version we already pin, which no push will ever trigger.

on:
  push:
    branches: [main]
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/audit.yml"
  schedule:
    # 06:41 UTC Monday, after the Dependabot run that may have already fixed
    # whatever this would otherwise report.
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Scan the lockfile for known advisories
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs here rather than to tags. A
      # tag is mutable: whoever controls the upstream repository can move it
      # to different code, and this job is the one that would have to catch
      # that. .github/zizmor.yml exempts the older workflows from
      # `unpinned-uses` as a tracked follow-up; a security workflow should not
      # be joining that list.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # No uv and no Python set-up: scanning uv.lock needs neither, and a
      # security job with fewer moving parts is a security job with less to
      # go wrong.

      # osv-scanner reads uv.lock directly, which is both simpler and more
      # accurate than exporting first. The lockfile already pins every
      # package across every extra and dev group -- dev-only and extra-only
      # packages run in CI and ship in the Docker image, so an advisory in
      # one of them is still ours.
      #
      # This used to export to requirements.txt and scan that. osv-scanner
      # v2.6.0 treats `requirements.txt` as a *transitive* source and tries
      # to re-resolve it, which fails on a fully-pinned export:
      #
      #   failed resolution: requirements conflict:
      #   filelock: "==4.1.1,>=3.16.1,<=3.19.1,>=3.19.1"
      #
      # and then reports "0 packages affected ... from 0 ecosystems" -- it
      # scanned nothing while exiting non-zero. Scanning the lockfile needs
      # no resolution step at all, so that failure mode cannot recur.
      #
      # osv-scanner rather than pip-audit: pip-audit resolves and installs
      # the requirements into a throwaway virtualenv, which fails on this
      # graph (one dependency has no sdist for the resolver's Python).
      - name: Scan with osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc  # v2.6.0
        with:
          scan-args: |-
            --lockfile=uv.lock
