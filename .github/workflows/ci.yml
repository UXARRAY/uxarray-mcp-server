name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: pre-commit/action@v3.0.1

  test-core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # requires-python is ">=3.11" with no upper bound, so the matrix has to
        # cover the floor and the newest release -- otherwise the metadata is a
        # claim nothing verifies. 3.12 remains the version the HPC submitter
        # path is supported on; 3.11 and 3.13 are local-only territory, which
        # is what the great majority of installs actually use.
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install core dependencies
      run: |
        uv sync --dev

    - name: Run core tests
      # Select by marker, not by filename. This job installs no optional
      # extras, so it runs everything except `hpc` (needs the extra, run by
      # test-hpc below) and `live` (needs a real cluster, never in CI). The
      # old --ignore=tests/test_remote_agent.py was too blunt: that file
      # imports fine without academy-py and most of it was runnable here.
      run: |
        uv run pytest tests/ -v -m "not hpc and not live and not yac"

  cli-smoke:
    # Smoke-tests the installed `uxarray-mcp` CLI against the user-home config
    # discovery path. Catches packaging / entry-point regressions that pytest
    # against the source tree would not see.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install package
      run: |
        uv sync --dev

    - name: CLI help surfaces
      run: |
        uv run uxarray-mcp --help
        uv run uxarray-mcp serve --help
        uv run uxarray-mcp setup --help
        uv run uxarray-mcp endpoints --help
        uv run uxarray-mcp endpoints list --help
        uv run uxarray-mcp endpoints add --help
        uv run uxarray-mcp doctor --help
        uv run uxarray-mcp install-claude --help

    - name: CLI doctor (local-only, no endpoint configured)
      # A fresh install with no endpoint configured is a valid, expected
      # local-only setup (HPC is opt-in) and must exit 0 -- regression
      # check for the bug where `doctor` failed every local-only install.
      run: |
        uv run uxarray-mcp setup
        uv run uxarray-mcp doctor

    - name: CLI endpoints add/list roundtrip
      run: |
        uv run uxarray-mcp endpoints add ci-stub 00000000-0000-0000-0000-000000000000 --path-prefix /tmp/
        uv run uxarray-mcp endpoints list

    - name: CLI doctor (no remote probe)
      # `doctor` exits non-zero whenever any check fails, including the
      # "endpoint not reachable" case we expect in CI (the stub endpoint
      # UUID is unregistered). Treat the command as a smoke test of the
      # entry point and JSON serialization, not the health verdict.
      run: |
        uv run uxarray-mcp doctor --skip-remote-probe || true

  package-smoke:
    # Builds the wheel and installs it into a fresh venv. This catches missing
    # package data and console-script regressions before publishing to PyPI.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build wheel and sdist
      run: uv build

    - name: Install wheel in a clean venv
      run: |
        uv venv /tmp/uxarray-mcp-wheel --python 3.12
        uv pip install --python /tmp/uxarray-mcp-wheel/bin/python dist/uxarray_mcp-*.whl
        /tmp/uxarray-mcp-wheel/bin/uxarray-mcp --help
        /tmp/uxarray-mcp-wheel/bin/python scripts/check_mcp_handshake.py \
          --command /tmp/uxarray-mcp-wheel/bin/uxarray-mcp

  test-hpc:
    runs-on: ubuntu-latest
    # HPC lane is non-blocking — requires Globus Compute which may not install cleanly
    continue-on-error: true
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install HPC dependencies
      run: |
        uv sync --extra hpc --dev

    - name: Run HPC tests
      # The other half of the partition: everything marked `hpc`, wherever it
      # lives. Naming the two files meant a new hpc-marked test in a third
      # file would never run.
      run: |
        uv run pytest tests/ -v -m "hpc and not yac"

  test-yac:
    # The conservative remap is the most accurate method this server offers
    # (the ERA5 case study measured ~4x less drift in the field mean than
    # nearest neighbour) and the only one that needs a from-source build. Every
    # other YAC test in the suite passes with YAC absent -- they check routing
    # and refusal messages -- so without this lane the backend could break and
    # nothing would go red.
    #
    # This runs scripts/build_yac_local.sh rather than open-coding the build,
    # so CI exercises the same path a contributor is told to use. A drift
    # between the documented build and the tested one is exactly the failure
    # this is meant to prevent.
    runs-on: ubuntu-latest
    # Non-blocking for now: a from-source MPI build against an upstream GitLab
    # is a real external dependency, and a DKRZ outage should not wedge every
    # unrelated PR. Revisit once it has a track record.
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential gfortran autoconf automake libtool pkg-config \
          libopenmpi-dev openmpi-bin

    - name: Install project dependencies
      run: uv sync --dev

    - name: Install the binding build dependencies
      # YAC's Python bindings are Cython-generated, and its configure probes
      # mpi4py to confirm the interpreter and the MPI agree; setuptools is absent
      # from a uv-made venv and configure needs it too; pip because YAC's own
      # make install shells out to `python -m pip`. None belong in the
      # project dependencies -- they are only needed to *build* YAC.
      run: uv pip install "cython>=3.0.0" mpi4py setuptools pip

    - name: Preflight the build script
      # --check exits non-zero with the missing prerequisite named, so a
      # tooling gap is reported as itself rather than as a compile error 300
      # lines into make.
      run: ./scripts/build_yac_local.sh --check

    - name: Build YAC and link it into the venv
      # --link-into-venv writes the .pth, which is the part that has to keep
      # working: YAC was hand-installed into .venv once and `uv sync` deleted
      # it, which is why the flag exists.
      run: |
        ./scripts/build_yac_local.sh \
          --python "$(pwd)/.venv/bin/python" \
          --link-into-venv \
          --jobs 2

    - name: Run the YAC tests
      # -m yac, so this lane runs exactly what every other lane deselects.
      run: uv run pytest tests/ -v -m yac

  docs:
    runs-on: ubuntu-latest
    needs: [pre-commit, test-core]
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install docs dependencies
      run: |
        uv sync --extra docs --dev

    - name: Build Sphinx docs
      run: |
        uv run sphinx-build -b html docs docs/_build/html -W --keep-going
