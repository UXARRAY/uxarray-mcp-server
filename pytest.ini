[pytest]
asyncio_mode = auto
testpaths = tests
# tests import their shared helpers as `tests.fake_endpoint` / `tests.mcp_harness`.
pythonpath = .
# CI selects by marker, never by filename.
markers =
    hpc: needs the optional `hpc` extra (globus-compute-sdk). One CI job installs it and runs `-m hpc`; every other job runs `-m "not hpc"`.
    live: submits real work to a configured Globus Compute endpoint. Never runs in CI; needs the UXMCP_LIVE_* environment variables.
    slow: takes seconds, not milliseconds.
    yac: needs a working YAC build (scripts/build_yac_local.sh). One CI job builds YAC and runs `-m yac`.
