[pytest]
asyncio_mode = auto
testpaths = tests
# tests/test_multi_turn_eval.py imports the eval harness under evals/, which
# is deliberately not shipped as part of the installed package.
pythonpath = .
# CI selects by marker, never by filename. A filename ignore has to be repeated
# in every workflow and says nothing about why the file is excluded; worse, it
# hides the tests in that file that would have run fine.
markers =
    hpc: needs the optional `hpc` extra (globus-compute-sdk, academy-py). One CI job installs it and runs `-m hpc`; every other job runs `-m "not hpc"`, so the test is deselected visibly rather than skipped green.
    live: submits real work to a configured Globus Compute endpoint. Never runs in CI; needs the UXMCP_LIVE_* environment variables.
    slow: takes seconds, not milliseconds. Not deselected anywhere by default — `-m "not slow"` is for tightening a local edit loop.
